<script>
'use strict';
/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const money = (n, cur = 'ARS') => { const d = Math.abs(n % 1) < 0.005 ? 0 : 2; return new Intl.NumberFormat('es-AR', { style: 'currency', currency: cur, minimumFractionDigits: d, maximumFractionDigits: d }).format(n); };
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z\s]/g, ' ').replace(/\s+/g, ' ').trim();
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

// Acepta "1.234,56", "1,234.56", "1234.56"
function parseNum(v) {
  if (v == null) return null;
  let s = String(v).trim().replace(/[^\d.,\-]/g, '');
  if (!s) return null;
  const neg = s.startsWith('-');
  s = s.replace(/-/g, '');
  const dot = s.lastIndexOf('.'), com = s.lastIndexOf(',');
  if (dot >= 0 && com >= 0) s = dot > com ? s.replace(/,/g, '') : s.replace(/\./g, '').replace(',', '.');
  else if (com >= 0) { s = s.replace(/,/g, '.'); if ((s.match(/\./g) || []).length > 1) s = s.replace(/\./g, ''); }
  else if (dot >= 0 && /^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  const n = parseFloat(s);
  return isNaN(n) ? null : (neg ? -n : n);
}
const numStr = n => String(n).replace('.', ',');

/* ---------- datos ---------- */
const KEY = 'gastos.v2';
const APP_VERSION = 'v22 · 3 nov 2026';
// row = nombre de la fila del Sheet donde se acumula (Venta USD). Las categorías nuevas van a "Varios".
const DEFAULT_CATS = [
  { id: 'cenas', name: 'Cenas', emoji: '🍽️', color: '#f08c00', row: 'Varios' },
  { id: 'padel', name: 'Padel', emoji: '🎾', color: '#2f9e44', row: 'Varios' },
  { id: 'salidas', name: 'Salidas', emoji: '🍻', color: '#d6336c', row: 'Varios' },
  { id: 'delivery', name: 'Delivery', emoji: '🛵', color: '#e8590c', row: 'Varios' },
  { id: 'compras', name: 'Compras', emoji: '🛍️', color: '#0c8599', row: 'Varios' },
  { id: 'viajes', name: 'Viajes', emoji: '✈️', color: '#1098ad', row: 'Varios' },
  { id: 'otros', name: 'Otros', emoji: '📦', color: '#868e96', row: 'Varios' },
  { id: 'carlos', name: 'Carlos', emoji: '🤝', color: '#5c7cfa', row: 'Carlos' },
  { id: 'marcel', name: 'Inglés Marcel', emoji: '🇬🇧', color: '#4263eb', row: 'Ingles Marcel' },

  { id: 'mc', name: 'Tarjeta MC', emoji: '💳', color: '#e03131', row: 'Tarjeta MC', card: true, pago: true },
  { id: 'amex', name: 'Tarjeta AMEX', emoji: '💳', color: '#0b7285', row: 'Tarjeta AMEX', card: true, pago: true },
  { id: 'sueldo', name: 'Sueldo', emoji: '💼', color: '#2f9e44', row: 'Sueldo LI.FI', kind: 'ingreso', cur: 'USD' },
  { id: 'reintegro', name: 'Me devuelven plata', emoji: '↩️', color: '#20c997', row: 'Varios', kind: 'ingreso' },
];
const FX_PLATFORMS = ['Venta USDT - Binance', 'Venta USDC - Binance', 'Venta USDC - Buenbit', 'Venta USDT - Buenbit', 'MEP'];
// palabras clave para sugerir categoría (solo se usan si la categoría existe)
const KW = {
  super: ['coto', 'carrefour', 'disco', 'jumbo', 'changomas', 'supermercado', 'verduleria', 'carniceria', 'dia', 'chino'],
  delivery: ['rappi', 'pedidosya', 'pedidos ya', 'delivery'],
  cenas: ['cena', 'restaurant', 'resto', 'parrilla', 'pizza', 'sushi'],
  salidas: ['bar', 'boliche', 'cine', 'teatro', 'recital', 'entrada', 'cerveza', 'birra', 'drinks'],
  padel: ['padel', 'cancha', 'paddle'],
  transporte: ['uber', 'cabify', 'didi', 'sube', 'nafta', 'ypf', 'peaje', 'estacionamiento', 'taxi'],
  salud: ['farmacia', 'farmacity', 'medico', 'dentista', 'kinesio', 'psicologo'],
  subs: ['netflix', 'spotify', 'youtube', 'icloud', 'chatgpt', 'openai', 'claude', 'github'],
  viajes: ['aerolineas', 'flybondi', 'booking', 'airbnb', 'hotel', 'despegar', 'vuelo', 'latam', 'pasaje', 'hostel'],
  compras: ['mercadolibre', 'mercado libre', 'amazon', 'ropa', 'zapatillas'],
};

function load() {
  try {
    const j = JSON.parse(localStorage.getItem(KEY));
    if (j && j.entries) {
      if (!j.statements) j.statements = [];
      // Se quitan las categorías que se pagan con tarjeta (solo si no tienen movimientos)
      if (j.settings && !j.settings.cleanup1) {
        const quitar = ['super', 'transporte', 'salud', 'subs'];
        j.categories = j.categories.filter(c => !quitar.includes(c.id) || j.entries.some(e => e.cat === c.id));
        j.settings.cleanup1 = true;
      }
      // Seguimiento de pago ("A pagar" / "Pagado") para los gastos grandes (una sola vez)
      if (j.settings && !j.settings.cleanup4) {
        j.categories.forEach(c => { if (['alquiler', 'expensas', 'monotributo', 'patente', 'visa', 'mc', 'amex'].includes(c.id) && c.pago === undefined) c.pago = true; });
        j.settings.cleanup4 = true;
      }
      // Se agrega la categoría Viajes (una sola vez)
      if (j.settings && !j.settings.cleanup3) {
        if (!j.categories.some(c => c.id === 'viajes' || String(c.name).toLowerCase() === 'viajes')) {
          const i = j.categories.findIndex(c => c.id === 'otros');
          j.categories.splice(i >= 0 ? i : j.categories.length, 0, { id: 'viajes', name: 'Viajes', emoji: '✈️', color: '#1098ad', row: 'Varios' });
        }
        j.settings.cleanup3 = true;
      }
      // Se quitan los atajos (monto fijo) de Carlos y Marcel de Inicio
      if (j.settings && !j.settings.cleanup2) {
        j.categories.forEach(c => { if (c.id === 'carlos' || c.id === 'marcel') delete c.preset; });
        j.settings.cleanup2 = true;
      }
      return j;
    }
  } catch (e) {}
  return { entries: [], statements: [], categories: DEFAULT_CATS, settings: { url: '', token: '', rate: 1600, runway: null, runwayText: '', lastSync: null, theme: 'auto' } };
}
let S = load();
let storageOk = true;
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { storageOk = false; toast('⚠️ No se pudo guardar en este navegador'); }
}
const cat = id => S.categories.find(c => c.id === id) || S.categories.find(c => c.id === 'otros') || S.categories[0];
const live = () => S.entries.filter(e => !e.deleted);
const allItems = () => [...S.entries, ...S.statements];
const movs = () => live().filter(e => e.type === 'mov');

function history() {
  const h = {};
  movs().filter(e => e.kind === 'gasto').sort((a, b) => a.date.localeCompare(b.date)).forEach(e => { const k = norm(e.concept); if (k) h[k] = e.cat; });
  return h;
}
function suggestCat(concept, h = history()) {
  const n = norm(concept);
  if (n.length < 2) return null;
  if (h[n] && S.categories.some(c => c.id === h[n])) return h[n];
  const near = Object.keys(h).find(k => (k.startsWith(n) || n.startsWith(k)) && Math.min(k.length, n.length) >= 3);
  if (near && S.categories.some(c => c.id === h[near])) return h[near];
  const padded = ' ' + n + ' ';
  for (const [id, words] of Object.entries(KW)) {
    if (!S.categories.some(c => c.id === id)) continue;
    if (words.some(w => padded.includes(' ' + w + ' ') || (w.length > 4 && n.includes(w)))) return id;
  }
  return null;
}

/* ---------- UI state ---------- */
const now = new Date();
const ui = { cotOpen: false, cur: 'ARS', view: 'list', y: now.getFullYear(), m: now.getMonth(), scope: 'todo', filter: null, showRunway: false };
const monthKey = (y, m) => `${y}-${pad(m + 1)}`;
const monthName = (y, m) => cap(new Date(y, m, 1).toLocaleDateString('es-AR', { month: 'long', year: 'numeric' }));
const monthEntries = (y, m) => live().filter(e => e.date.startsWith(monthKey(y, m)));
function shiftMonth(d) { const dt = new Date(ui.y, ui.m + d, 1); ui.y = dt.getFullYear(); ui.m = dt.getMonth(); }
// Claro de 7 a 19 h, oscuro el resto; se puede forzar en Más > Apariencia.
function applyTheme() {
  const t = S.settings.theme || 'auto', h = new Date().getHours();
  document.documentElement.dataset.theme = t === 'auto' ? (h >= 7 && h < 19 ? 'light' : 'dark') : t;
}
const THEME_LABEL = { auto: 'Automática (claro de día, oscuro de noche)', light: 'Siempre claro', dark: 'Siempre oscuro' };
let runwayTimer = null;
function hideRunway() { clearTimeout(runwayTimer); if (ui.showRunway) { ui.showRunway = false; render(); } }
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2600); }
function openSheet(html) { $('#sheet').innerHTML = '<div class="grab"></div>' + html; $('#overlay').hidden = false; }
function closeSheet() { $('#overlay').hidden = true; $('#sheet').innerHTML = ''; }

// Totales del mes: pesos y dólares por separado, sin convertir. Los pagos de tarjeta se separan porque son el resumen, no el detalle.
function totals(y, m) {
  const t = { gasto: 0, ingreso: 0, tarjeta: 0, usdGasto: 0, usdIngreso: 0 };
  monthEntries(y, m).filter(e => e.type === 'mov').forEach(e => {
    const usd = e.currency === 'USD';
    if (e.kind === 'ingreso') { if (usd) t.usdIngreso += e.amount; else t.ingreso += e.amount; }
    else if (cat(e.cat).card) { if (!usd) t.tarjeta += e.amount; }
    else if (usd) t.usdGasto += e.amount; else t.gasto += e.amount;
  });
  return t;
}

/* ---------- vistas ---------- */
function render() {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === ui.view));
  $('.fab').style.display = ui.view === 'more' ? 'none' : '';
  $('#head').innerHTML = ui.view === 'more' ? '<h1>Más</h1>'
    : `<button class="icon-btn" data-a="prev">‹</button><h1>${monthName(ui.y, ui.m)}</h1><button class="icon-btn" data-a="next">›</button>`;
  $('#main').innerHTML = ui.view === 'list' ? listView() : ui.view === 'report' ? reportView() : moreView();
}

function syncBanner() {
  if (!S.settings.url) return `<div class="banner"><span>Falta conectar el Sheet</span><button class="pill" data-a="conn">Configurar</button></div>`;
  const pend = allItems().filter(e => !e.synced).length;
  const errs = allItems().filter(e => e.err).length;
  if (errs) return `<div class="banner"><span>⚠️ ${errs} movimiento${errs > 1 ? 's' : ''} con error</span><button class="pill" data-a="sync">Reintentar</button></div>`;
  if (pend) return `<div class="banner"><span>⏳ ${pend} sin enviar al Sheet</span><button class="pill" data-a="sync">Enviar</button></div>`;
  return '';
}

function row(e) {
  if (e.type === 'fx') {
    return `<button class="row" data-a="edit" data-id="${e.id}" style="--c:#1c7ed6"><div class="dot">💱</div>
      <div class="mid"><div class="t">${esc(e.concept)}</div><div class="s">TC ${money(e.ars / e.usd)} ${e.synced ? '' : '· <span class="pend">⏳</span>'}</div></div>
      <div class="amt">${money(e.ars)}<small>US$ ${new Intl.NumberFormat('es-AR').format(e.usd)}</small></div></button>`;
  }
  const c = cat(e.cat), ing = e.kind === 'ingreso';
  const sub = '';
  return `<button class="row" data-a="edit" data-id="${e.id}" style="--c:${c.color}"><div class="dot">${c.emoji}</div>
    <div class="mid"><div class="t">${esc(e.concept || c.name)}</div><div class="s">${esc(c.name)}${e.partes ? ' · con ajustes' : ''}${e.estado === 'pend' ? ' · <span class="apagar">A pagar</span>' : e.estado === 'pago' ? ' · pagado ' + dm(e.pagadoEl || e.date) : ''}${e.synced ? '' : ' · <span class="pend">⏳</span>'}${e.err ? ' · ⚠️' : ''}</div></div>
    <div class="amt ${ing ? 'pos' : ''}">${ing ? '+' : '−'}${money(e.amount, e.currency)}${sub}</div></button>`;
}

// En los últimos días del mes (y los primeros del siguiente) se ofrece el desglose del mes que cierra.
function closingMonth() {
  const d = new Date(), day = d.getDate(), last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  let y = d.getFullYear(), m = d.getMonth();
  if (day <= 3) { const p = new Date(y, m - 1, 1); y = p.getFullYear(); m = p.getMonth(); }
  else if (day < last - 2) return null;
  const t = totals(y, m);
  return (t.gasto > 0 || t.usdGasto > 0) ? { y, m } : null;
}

const porPagar = () => live().filter(e => e.type === 'mov' && e.kind === 'gasto' && e.estado === 'pend');
function porPagarLinea() {
  const L = porPagar(); if (!L.length) return '';
  const a = L.filter(e => e.currency === 'ARS').reduce((x, e) => x + e.amount, 0), u = L.filter(e => e.currency === 'USD').reduce((x, e) => x + e.amount, 0);
  return `<button class="porpagar" data-a="porpagar">⏳ <b>Por pagar:</b> ${[a ? money(a) : '', u ? money(u, 'USD') : ''].filter(Boolean).join(' + ')} · ${L.length} ${L.length === 1 ? 'pendiente' : 'pendientes'} ›</button>`;
}
function openPorPagar() {
  const L = porPagar().sort((x, y) => x.date.localeCompare(y.date));
  if (!L.length) { closeSheet(); return; }
  openSheet(`<h2>Por pagar</h2><p class="note">Tocá “Pagué hoy” cuando lo pagues: se anota la fecha de hoy en tu planilla.</p>` +
    L.map(e => { const c = cat(e.cat); return `<div class="srow"><div class="top"><span>${c.emoji} ${esc(e.concept || c.name)} <span style="color:var(--mute)">· ${dm(e.date)}</span></span><b>${money(e.amount, e.currency)}</b></div>
      <div style="display:flex;gap:8px;margin-top:6px"><button class="pill on" data-a="pagar" data-id="${e.id}">✓ Pagué hoy</button><button class="pill" data-a="edit" data-id="${e.id}">Editar</button></div></div>`; }).join('') +
    `<button class="btn ghost" data-a="close">Cerrar</button>`);
}
function marcarPagado(id) {
  const e = S.entries.find(x => x.id === id); if (!e) return;
  e.estado = 'pago'; e.pagadoEl = today(); e.synced = false; e.err = null;
  save(); render(); toast('Marcado como pagado'); sync();
  porPagar().length ? openPorPagar() : closeSheet();
}

function listView() {
  const t = totals(ui.y, ui.m);
  const items = monthEntries(ui.y, ui.m);
  let html = syncBanner() + cotBanner();
  const cl = closingMonth();
  if (cl) {
    const ct = totals(cl.y, cl.m);
    const by = {};
    monthEntries(cl.y, cl.m).filter(e => e.type === 'mov' && e.kind === 'gasto' && e.currency === 'ARS' && !cat(e.cat).card).forEach(e => by[e.cat] = (by[e.cat] || 0) + e.amount);
    const top = Object.entries(by).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([id, v]) => `${cat(id).emoji} ${esc(cat(id).name)} ${money(v)}`).join(' · ');
    html += `<div class="card closing"><div class="sub" style="margin:0">Cierre de ${monthName(cl.y, cl.m)}</div>
      <div style="font-size:22px;font-weight:700;margin:2px 0">${money(ct.gasto)} en gastos</div>
      ${ct.usdGasto ? `<div class="sub" style="margin:0 0 4px">y ${money(ct.usdGasto, 'USD')} en dólares</div>` : ''}
      ${top ? `<div class="sub" style="margin:2px 0 10px">${top}</div>` : ''}
      <button class="pill on" data-a="closing" data-y="${cl.y}" data-m="${cl.m}">Ver desglose completo</button></div>`;
  }
  {
    const sa = S.settings.saldoArs, ru = S.settings.runway;
    const hasSa = sa != null && sa !== '', hasRu = ru != null && ru !== '';
    if (hasSa || hasRu) {
      const ruTxt = hasRu ? (ui.showRunway ? 'US$ ' + new Intl.NumberFormat('es-AR', { maximumFractionDigits: 0 }).format(ru) : 'US$ •••••') : '—';
      const hora = S.settings.lastSync ? ' · ' + new Date(S.settings.lastSync).toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' }) : '';
      html += `<div class="card"><div class="tot" style="grid-template-columns:1.2fr 1fr">
        <div><div class="label">Saldo en pesos</div><div class="big ${hasSa && sa < 0 ? 'neg' : ''}">${hasSa ? money(sa) : '—'}</div></div>
        <div><div class="label">Ahorros</div><div class="big">${ruTxt}</div></div></div>
        ${hasSa && sa < 0 ? faltaCambiar(-sa) : ''}
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px"><div class="sub" style="margin:0">Según tu planilla${hora}</div>
        ${hasRu ? `<button class="pill" data-a="runway">${ui.showRunway ? '🙈 Ocultar' : '👁 Ver ahorros'}</button>` : ''}</div></div>`;
    }
  }
  html += porPagarLinea();
  html += `<div class="card hero"><div class="tot">
    <div><div class="label">Gastos</div><div class="big" style="${money(t.gasto).length > 12 ? 'font-size:15px' : ''}">${money(t.gasto)}</div></div>
    <div><div class="label">Ingresos</div><div class="big pos" style="${money(t.ingreso).length > 12 ? 'font-size:15px' : ''}">${money(t.ingreso)}</div></div>
    <div><div class="label">Tarjetas</div><div class="big" style="${money(t.tarjeta).length > 12 ? 'font-size:15px' : ''}">${money(t.tarjeta)}</div></div></div>
    ${(t.usdGasto || t.usdIngreso) ? `<div class="sub">En dólares: gastos ${money(t.usdGasto, 'USD')} · ingresos ${money(t.usdIngreso, 'USD')}</div>` : ''}</div>`;
  const presets = S.categories.filter(c => c.preset);
  if (presets.length) html += `<div class="chips">` + presets.map(c => `<button data-a="preset" data-id="${c.id}">${c.emoji} ${esc(c.name)} ${money(c.preset)}</button>`).join('') + `</div>`;
  if (!items.length) return html + `<div class="empty"><b>🧾</b>Todavía no hay movimientos este mes.<br>Tocá + para cargar el primero.</div>`;
  const byDay = {};
  items.sort((a, b) => b.date.localeCompare(a.date)).forEach(e => (byDay[e.date] ||= []).push(e));
  for (const [d, list] of Object.entries(byDay)) {
    const [y, m, dd] = d.split('-').map(Number);
    const label = new Date(y, m - 1, dd).toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric', month: 'short' });
    const dg = list.filter(e => e.type === 'mov' && e.kind === 'gasto' && !cat(e.cat).card);
    const dArs = dg.filter(e => e.currency === 'ARS').reduce((s, e) => s + e.amount, 0), dUsd = dg.filter(e => e.currency === 'USD').reduce((s, e) => s + e.amount, 0);
    const dayTxt = [dArs ? money(dArs) : '', dUsd ? money(dUsd, 'USD') : ''].filter(Boolean).join(' · ');
    html += `<div class="day"><span>${label}</span><span>${dayTxt}</span></div>` + list.map(row).join('');
  }
  return html;
}

const curPills = () => `<div style="display:flex;gap:6px;margin-bottom:12px"><button class="pill ${ui.cur === 'ARS' ? 'on' : ''}" data-a="cur" data-v="ARS">Pesos</button><button class="pill ${ui.cur === 'USD' ? 'on' : ''}" data-a="cur" data-v="USD">Dólares</button><button class="pill ${ui.cur === 'TARJ' ? 'on' : ''}" data-a="cur" data-v="TARJ">Tarjetas</button></div>`;
const dm = d => String(d).slice(8) + '/' + String(d).slice(5, 7);
const STMT_PAL = ['#f08c00', '#1c7ed6', '#e03131', '#7048e8', '#0c8599', '#d6336c', '#2f9e44', '#5c7cfa', '#e8590c', '#868e96', '#9775fa', '#20c997'];
const stmtColor = n => STMT_PAL[[...String(n)].reduce((a, c) => a + c.charCodeAt(0), 0) % STMT_PAL.length];

function stmtView() {
  const key = monthKey(ui.y, ui.m);
  const pd = new Date(ui.y, ui.m - 1, 1), pkey = monthKey(pd.getFullYear(), pd.getMonth());
  const sts = S.statements.filter(x => !x.deleted && x.mes === key);
  const prev = S.statements.filter(x => !x.deleted && x.mes === pkey);
  const flat = list => list.flatMap(x => x.lines.map(l => ({ ...l, card: x.card })));
  const L = flat(sts).filter(l => l.m === 'ARS'), U = flat(sts).filter(l => l.m === 'USD'), P = flat(prev).filter(l => l.m === 'ARS');
  const total = L.reduce((a, l) => a + l.v, 0), totalP = P.reduce((a, l) => a + l.v, 0);
  const faltan = ['Tarjeta VISA', 'Tarjeta MC', 'Tarjeta AMEX'].filter(c => !sts.some(x => x.card === c));
  const delta = (a, b) => b ? ` <span style="color:${a > b ? 'var(--danger)' : 'var(--good)'}">${a > b ? '▲' : '▼'} ${Math.abs(Math.round((a - b) / b * 100))}%</span>` : '';
  let html = `<div class="card">${curPills()}`;
  if (!sts.length) {
    return html + `<div class="empty" style="padding:24px 8px"><b>💳</b>Todavía no cargaste resúmenes de ${monthName(ui.y, ui.m)}.</div><button class="btn" data-a="stmt">Importar resumen de tarjeta</button></div>`;
  }
  html += `<div class="sub" style="margin:0">Consumo con tarjeta (según los resúmenes)</div>
    <div style="font-size:34px;font-weight:700;letter-spacing:-.02em;margin-top:6px">${money(total)}</div>
    <div class="sub" style="margin-top:0">${L.length} consumos${totalP ? ' ·' + delta(total, totalP) + ' vs mes anterior' : ''}${U.length ? ' · ' + money(U.reduce((a, l) => a + l.v, 0), 'USD') + ' en dólares' : ''}</div></div>`;
  if (faltan.length) html += `<div class="banner"><span>Falta cargar: ${faltan.map(esc).join(', ')}</span></div>`;
  html += `<div class="card"><h3>Resúmenes cargados</h3>` + sts.map(x => `<button class="row" data-a="stmtopen" data-id="${esc(x.id)}" style="--c:#1c7ed6;margin-bottom:6px"><div class="dot">💳</div>
    <div class="mid"><div class="t">${esc(x.card)}</div><div class="s">cierre ${dm(x.cierre)} · vence ${dm(x.vence)}${x.cargado ? ' · cargado ' + dm(x.cargado) : ''}${x.synced ? '' : ' · ⏳'}</div></div><div class="amt">${money(x.totalArs)}</div></button>`).join('') + `</div>`;
  const by = {}, byP = {};
  L.forEach(l => { by[l.c] = (by[l.c] || 0) + l.v; }); P.forEach(l => { byP[l.c] = (byP[l.c] || 0) + l.v; });
  html += `<div class="card"><h3>Por categoría</h3>` + Object.keys(by).sort((a, b) => by[b] - by[a]).map(c => {
    const p = total ? by[c] / total * 100 : 0;
    return `<div class="bar" style="--c:${stmtColor(c)}"><div class="top"><span>${esc(c)}</span><b>${money(by[c])} <span style="color:var(--mute);font-weight:400">${p.toFixed(0)}%</span>${delta(by[c], byP[c] || 0)}</b></div><div class="track"><div class="fill" style="width:${p}%"></div></div></div>`;
  }).join('') + `</div>`;
  const com = {}, prevCom = {};
  L.forEach(l => { const o = com[l.n] = com[l.n] || { v: 0, n: 0 }; o.v += l.v; o.n++; }); P.forEach(l => { prevCom[l.n] = 1; });
  html += `<div class="card"><h3>Comercios que más pesan</h3>` + Object.keys(com).sort((a, b) => com[b].v - com[a].v).slice(0, 10).map(n =>
    `<div class="lrow"><span>${esc(n)} <span style="color:var(--mute)">×${com[n].n}${prevCom[n] ? ' · se repite' : ''}</span></span><b>${money(com[n].v)}</b></div>`).join('') + `</div>`;
  const cu = {};
  L.filter(l => l.q).forEach(l => { for (let j = 1; j <= l.q[1] - l.q[0]; j++) cu[j] = (cu[j] || 0) + l.v; });
  const cj = Object.keys(cu);
  if (cj.length) html += `<div class="card"><h3>Cuotas ya comprometidas</h3>` + cj.map(j => `<div class="lrow"><span>En ${j} ${+j > 1 ? 'resúmenes' : 'resumen'}</span><b>${money(cu[j])}</b></div>`).join('') + `</div>`;
  return html + `<button class="btn ghost" data-a="stmt">Importar otro resumen</button>`;
}

function reportView() {
  if (ui.cur === 'TARJ') return stmtView();
  const inScope = e => e.type === 'mov' && e.kind === 'gasto' && e.currency === ui.cur && !cat(e.cat).card && (ui.scope === 'todo' || cat(e.cat).row === 'Varios');
  const items = monthEntries(ui.y, ui.m).filter(inScope);
  const total = items.reduce((s, e) => s + e.amount, 0);
  const M = n => money(n, ui.cur);
  const monedaTxt = ui.cur === 'USD' ? 'dólares' : 'pesos';
  let html = `<div class="card">${curPills()}
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
    <div class="sub" style="margin:0">Gastos en ${monedaTxt} (sin pagos de tarjeta)</div>
    <div style="display:flex;gap:6px"><button class="pill ${ui.scope === 'todo' ? 'on' : ''}" data-a="scope" data-v="todo">Todo</button>
    <button class="pill ${ui.scope === 'varios' ? 'on' : ''}" data-a="scope" data-v="varios">Solo Varios</button></div></div>
    <div style="font-size:34px;font-weight:700;letter-spacing:-.02em;margin-top:6px">${M(total)}</div>
    <div class="sub" style="margin-top:0">${items.length} gasto${items.length === 1 ? '' : 's'}${items.length ? ` · promedio ${M(total / items.length)}` : ''}</div></div>`;
  if (!items.length) html += `<div class="empty"><b>📊</b>Sin gastos en ${monedaTxt} este mes.</div>`;
  else {
    const by = {};
    items.forEach(e => { const b = by[e.cat] ||= { v: 0, n: 0 }; b.v += e.amount; b.n++; });
    html += `<div class="card"><h3>Por categoría</h3>` + Object.entries(by).sort((a, b) => b[1].v - a[1].v).map(([id, b]) => {
      const c = cat(id), p = total ? b.v / total * 100 : 0;
      return `<div class="bar" style="--c:${c.color}"><div class="top"><span>${c.emoji} ${esc(c.name)} <span style="color:var(--mute)">· ${b.n}</span></span>
        <b>${M(b.v)} <span style="color:var(--mute);font-weight:400">${p.toFixed(0)}%</span></b></div><div class="track"><div class="fill" style="width:${p}%"></div></div></div>`;
    }).join('') + `</div>`;
    // gastos hormiga: conceptos que se repiten
    const byC = {};
    items.forEach(e => { const k = norm(e.concept) || '(sin concepto)'; const b = byC[k] ||= { label: e.concept || '(sin concepto)', v: 0, n: 0 }; b.v += e.amount; b.n++; });
    const top = Object.values(byC).sort((a, b) => b.v - a.v).slice(0, 8);
    html += `<div class="card"><h3>Dónde se va más plata</h3>` + top.map(b => `<div class="lrow"><span>${esc(b.label)} <span style="color:var(--mute)">×${b.n}</span></span><b>${M(b.v)}</b></div>`).join('') + `</div>`;
  }
  const ms = [];
  for (let i = 5; i >= 0; i--) { const d = new Date(ui.y, ui.m - i, 1); ms.push({ y: d.getFullYear(), m: d.getMonth(), cur: i === 0 }); }
  ms.forEach(x => x.v = monthEntries(x.y, x.m).filter(inScope).reduce((s, e) => s + e.amount, 0));
  const max = Math.max(...ms.map(x => x.v), 1);
  html += `<div class="card"><h3>Últimos 6 meses</h3><div class="months">` + ms.map(x =>
    `<div class="${x.cur ? 'cur' : ''}"><i style="height:${Math.max(x.v / max * 90, 3)}%"></i>${new Date(x.y, x.m, 1).toLocaleDateString('es-AR', { month: 'short' })}</div>`).join('') + `</div></div>`;
  return html;
}

function moreView() {
  const s = S.settings;
  const pend = allItems().filter(e => !e.synced).length;
  return `
  <button class="menu" data-a="conn"><span class="e">🔗</span><span>Conexión con el Sheet<small>${s.url ? (pend ? `${pend} pendiente${pend > 1 ? 's' : ''} de enviar` : 'Conectado') + (s.lastSync ? ' · última sync ' + new Date(s.lastSync).toLocaleString('es-AR', { dateStyle: 'short', timeStyle: 'short' }) : '') : 'Sin configurar'}</small></span></button>
  <button class="menu" data-a="sync"><span class="e">↻</span><span>Sincronizar ahora<small>Envía lo pendiente y actualiza los ahorros</small></span></button>
  <button class="menu" data-a="pull"><span class="e">⬇️</span><span>Traer todo del Sheet<small>Para recuperar datos en un teléfono nuevo</small></span></button>
  <button class="menu" data-a="cats"><span class="e">🏷️</span><span>Categorías y atajos<small>Agregar categorías, fila del Sheet y monto fijo</small></span></button>
  <button class="menu" data-a="theme"><span class="e">🌗</span><span>Apariencia<small>${THEME_LABEL[s.theme || 'auto']}</small></span></button>
  <button class="menu" data-a="update"><span class="e">🔄</span><span>Buscar actualización<small>Versión de la app: ${APP_VERSION}</small></span></button>
  <button class="menu" data-a="stmt"><span class="e">💳</span><span>Importar resumen de tarjeta<small>Cargar los consumos de VISA, MC o AMEX</small></span></button>
  <button class="menu" data-a="backup"><span class="e">💾</span><span>Copia local (JSON)<small>El respaldo principal es tu Sheet</small></span></button>
  <p class="note">Tu Google Sheet es la base de datos: cada gasto se suma en su fila del mes y el detalle queda en una nota de esa fila. Lo que cargues sin señal se guarda y se envía solo cuando vuelva la conexión. ${storageOk ? '' : '<b>⚠️ El guardado local está bloqueado.</b>'}</p>`;
}

    <button class="btn" id="xSave">Guardar</button>

  const q = s => $(s, $('#sheet'));
  const fmt2 = n => String(Math.round(n * 100) / 100).replace('.', ',');

      : 'Poné el TC que obtuviste o los pesos que te acreditaron.';

    else { driver = 'ars'; if (u > 0 && a > 0) q('#xTcIn').value = fmt2(a / u); }
  };
  q('#xUsd').oninput = () => calc('usd'); q('#xTcIn').oninput = () => calc('tc'); q('#xArs').oninput = () => calc('ars'); pista();
  q('#xPlat').onclick = ev => { const b = ev.target.closest('button'); if (!b) return; d.concept = b.dataset.p; q('#xCon').value = ''; q('#xPlat').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); };

    afterSave(date, 'Conversión guardada');
  };
  if (e) q('#xDel').onclick = () => removeEntry(e);
}

function upsert(rec) {
  const i = S.entries.findIndex(x => x.id === rec.id);
  if (i >= 0) S.entries[i] = rec; else S.entries.push(rec);
}
function removeEntry(e) {
  if (!confirm('¿Eliminar este movimiento?')) return;
  if (e.known) { e.deleted = true; e.synced = false; e.err = null; } else S.entries = S.entries.filter(x => x.id !== e.id);
  save(); closeSheet(); render(); toast('Eliminado'); sync();
}
function afterSave(date, msg) {
  const [y, m] = date.split('-').map(Number); ui.y = y; ui.m = m - 1; ui.view = 'list';
  save(); closeSheet(); render(); toast(msg); sync();
}

/* ---------- cotizaciones: dólar MEP, Binance y Fiwind ---------- */
const COT_KEY = 'gastos.fx';
const COT_SRC = {
  mep: { url: 'https://dolarapi.com/v1/dolares/bolsa', pick: j => j.venta, label: 'MEP' },
  binance: { url: 'https://criptoya.com/api/binance/USDT/ARS/1', pick: j => j.totalBid, label: 'Binance' },
  fiwind: { url: 'https://criptoya.com/api/fiwind/USDT/ARS/1', pick: j => j.totalBid, label: 'Fiwind' },
};
let COT = (() => { try { return JSON.parse(localStorage.getItem(COT_KEY)) || {}; } catch (e) { return {}; } })();
let cotBusy = false;
const cotSave = () => { try { localStorage.setItem(COT_KEY, JSON.stringify(COT)); } catch (e) {} };
const cotHora = t => t ? new Date(t).toLocaleString('es-AR', { hour: '2-digit', minute: '2-digit', ...(new Date(t).toDateString() === new Date().toDateString() ? {} : { day: '2-digit', month: '2-digit' }) }) : '';

async function refreshCot(manual) {
  if (cotBusy) return;
  cotBusy = true; if (ui.view === 'list') render();
  const ahora = Date.now(), keys = Object.keys(COT_SRC);
  const res = await Promise.allSettled(keys.map(async k => {
    const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 8000);
    try {
      const r = await fetch(COT_SRC[k].url, { signal: ctl.signal, cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const v = Number(COT_SRC[k].pick(await r.json()));
      if (!(v > 0)) throw new Error('sin dato');
      return v;
    } finally { clearTimeout(to); }
  }));
  keys.forEach((k, i) => {
    const o = COT[k] || {};
    COT[k] = res[i].status === 'fulfilled' ? { v: res[i].value, t: ahora, stale: false } : { v: o.v || null, t: o.t || null, stale: true };   // si falla, queda el último valor guardado
  });
  COT.consulta = ahora; cotSave(); cotBusy = false;
  if (manual) toast(keys.every(k => !COT[k].stale) ? '✓ Cotizaciones actualizadas' : '⚠️ No pude actualizar todo: uso el último valor guardado');
  render();
}
// Si el saldo en pesos es negativo: cuánto falta y cuántos USD cambiar al TC sugerido (redondeado hacia arriba)
function faltaCambiar(deficit) {
  const b = cotMejor();
  if (!b) return `<div class="falta" style="color:var(--mute)">Sin cotización para calcular (tocá ↻)</div>`;
  const usd = Math.ceil(deficit / b.v);
  return `<button class="falta" data-a="cambiar" data-usd="${usd}">Cambiar ≈ <b>US$ ${new Intl.NumberFormat('es-AR').format(usd)}</b> para estar al día${b.stale ? ' ⚠️' : ''}</button>`;
}
// TC por defecto: el mejor (más alto) entre Binance y Fiwind
function cotMejor() {
  const c = ['binance', 'fiwind'].map(k => ({ k, v: COT[k] && COT[k].v, stale: COT[k] && COT[k].stale, t: COT[k] && COT[k].t })).filter(x => x.v > 0);
  return c.length ? c.reduce((a, x) => (x.v > a.v ? x : a)) : null;
}
function cotBanner() {
  const keys = Object.keys(COT_SRC);
  if (!keys.some(k => COT[k] && COT[k].v)) return `<div class="cot-line"><span style="padding:6px 4px">💱 ${cotBusy ? 'Consultando cotizaciones…' : 'Cotizaciones sin datos'}</span><button class="pill" data-a="cot">↻</button></div>`;
  const best = cotMejor(), stale = keys.some(k => COT[k] && COT[k].stale);
  const tOk = Math.max(...keys.map(k => (COT[k] && COT[k].t) || 0));
  const principal = best ? `${COT_SRC[best.k].label} ★ ${money(best.v)}` : `MEP ${money(COT.mep.v)}`;
  const estado = stale ? `<span style="color:var(--danger)">desactualizado ${cotHora(tOk)} ⚠️</span>` : cotBusy ? 'consultando…' : cotHora(COT.consulta);
  const linea = `<div class="cot-line"><button class="cot-main" data-a="cotopen">💱 ${principal} · ${estado} ${ui.cotOpen ? '▴' : '▾'}</button><button class="pill" data-a="cot">↻</button></div>`;
  if (!ui.cotOpen) return linea;
  const celda = k => { const o = COT[k] || {}; return `<div><div class="label">${COT_SRC[k].label}${best && best.k === k ? ' ★' : ''}</div><div style="font-weight:700">${o.v ? money(o.v) : '—'}${o.stale && o.v ? ' ⚠️' : ''}</div></div>`; };
  return linea + `<div class="card" style="padding:12px 14px"><div class="tot" style="grid-template-columns:1fr 1fr 1fr">${keys.map(celda).join('')}</div>
    <div class="sub" style="margin-top:8px">${stale ? 'Desactualizado · último dato ' + cotHora(tOk) : 'Actualizado ' + cotHora(COT.consulta)} · ★ mejor TC (Binance / Fiwind, neto de comisiones)</div></div>`;
}

/* ---------- sincronización con el Sheet ---------- */
function applyStatus(st) {
  if (!st) return;
  S.settings.runway = st.runway === '' ? null : st.runway;
  S.settings.runwayText = st.runwayText;
  if (st.saldoArs !== undefined) S.settings.saldoArs = st.saldoArs === '' ? null : st.saldoArs;
}
async function api(body) {
  const { url, token } = S.settings;
  if (!url) throw new Error('Falta configurar el Sheet');
  const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ token, ...body }), redirect: 'follow' });
  let j; try { j = await r.json(); } catch (e) { throw new Error('El Sheet no respondió bien (revisá la URL y que el acceso sea "Cualquier persona")'); }
  if (!j.ok) throw new Error(j.error || 'Error del Sheet');
  return j;
}
const wire = e => e.deleted ? { op: 'delete', type: e.type, id: e.id } :
  e.type === 'stmt' ? { op: 'upsert', type: 'stmt', id: e.id, card: e.card, cierre: e.cierre, vence: e.vence, mes: e.mes, titular: e.titular, cargado: e.cargado, totalArs: e.totalArs, totalUsd: e.totalUsd, lines: e.lines, known: !!e.known } :
  e.type === 'fx' ? { op: 'upsert', type: 'fx', id: e.id, date: e.date, usd: e.usd, ars: e.ars, concept: e.concept } :
  { op: 'upsert', type: 'mov', id: e.id, date: e.date, kind: e.kind, amount: e.amount, currency: e.currency, concept: e.concept, cat: cat(e.cat).name, row: e.row, estado: e.estado, pagadoEl: e.pagadoEl, partes: e.partes, known: !!e.known };

let syncing = false;
async function sync(manual) {
  if (syncing || !S.settings.url) return;
  syncing = true;
  try {
    const pend = allItems().filter(e => !e.synced);
    const j = await api({ action: 'push', entries: pend.map(wire) });
    const byId = Object.fromEntries(j.results.map(r => [r.id, r]));
    pend.forEach(e => {
      const r = byId[e.id];
      if (!r) return;
      if (r.ok) { e.synced = true; e.known = true; e.err = null; } else e.err = r.error;
    });
    S.entries = S.entries.filter(e => !(e.deleted && e.synced));
    S.statements = S.statements.filter(e => !(e.deleted && e.synced));
    applyStatus(j.status);
    S.settings.lastSync = Date.now();
    save(); render();
    const bad = allItems().filter(e => e.err).length;
    if (manual || bad) toast(bad ? `⚠️ ${bad} con error: ${allItems().find(e => e.err).err}` : '✓ Sincronizado');
  } catch (err) {
    if (manual) toast('Sin conexión con el Sheet: ' + err.message);
  } finally { syncing = false; }
}

async function pullAll() {
  try {
    const j = await api({ action: 'pull' });
    let added = 0;
    j.entries.forEach(r => {
      if (r.type === 'stmt') {
        const mineS = S.statements.find(x => x.id === r.id);
        if (mineS && !mineS.synced) return;
        if (!mineS) added++;
        const rec = { ...r, synced: true, known: true };
        const i = S.statements.findIndex(x => x.id === r.id);
        if (i >= 0) S.statements[i] = rec; else S.statements.push(rec);
        return;
      }
      const mine = S.entries.find(e => e.id === r.id);
      if (mine && !mine.synced) return; // lo local pendiente gana
      let c = S.categories.find(x => x.name.toLowerCase() === String(r.cat || '').toLowerCase());
      if (r.type === 'mov' && !c) {
        c = { id: uid(), name: r.cat || 'Otros', emoji: '🏷️', color: '#868e96', row: r.row || 'Varios', kind: r.kind === 'ingreso' ? 'ingreso' : undefined };
        S.categories.push(c);
      }
      const rec = r.type === 'fx'
        ? { id: r.id, type: 'fx', date: r.date, usd: +r.usd, ars: +r.ars, concept: r.concept, synced: true, known: true }
        : { id: r.id, type: 'mov', kind: r.kind, date: r.date, concept: r.concept || '', cat: c.id, row: r.row, currency: r.currency, amount: +r.amount, estado: r.estado === 'pend' || r.estado === 'pago' ? r.estado : undefined, pagadoEl: r.pagadoEl || null, partes: r.partes || undefined, synced: true, known: true };
      if (!mine) added++;
      upsert(rec);
    });
    applyStatus(j.status);
    S.settings.lastSync = Date.now();
    save(); render(); toast(`Traídos del Sheet: ${added} nuevos`);
  } catch (err) { toast('No pude traer los datos: ' + err.message); }
}

const numAR = s => parseFloat(String(s).replace(/\./g, '').replace(',', '.'));

function loadPdfJs() {
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  return new Promise((res, rej) => {
    const sc = document.createElement('script');
    sc.src = 'lib/pdf.min.js';
    sc.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'lib/pdf.worker.min.js'; res(window.pdfjsLib); };
    sc.onerror = () => rej(new Error('No pude cargar el lector de PDF. Fijate que la carpeta lib esté subida a GitHub.'));
    document.head.appendChild(sc);
  });
}

// Texto del PDF en el mismo orden en que está escrito: una línea nueva cada vez que cambia la altura.
async function pdfToText(buf) {
  const pdfjs = await loadPdfJs();
  const doc = await pdfjs.getDocument({ data: buf }).promise;
  let out = '';
  for (let p = 1; p <= doc.numPages; p++) {
    const tc = await (await doc.getPage(p)).getTextContent();
    const lines = []; let line = '', y = null;
    tc.items.forEach(it => {
      if (!('str' in it)) return;
      const iy = it.transform[5];
      if (y !== null && Math.abs(iy - y) > 3) { lines.push(line); line = ''; }
      line += (line && it.str ? ' ' : '') + it.str; y = iy;
      if (it.hasEOL) { lines.push(line); line = ''; y = null; }
    });
    if (line) lines.push(line);
    out += `\n=====PAGINA ${p}=====\n` + lines.map(l => l.replace(/\s+/g, ' ').trim()).join('\n');
  }
  return out;
}

const learnedCats = () => {
  const m = {};
  [...S.statements].filter(x => !x.deleted).sort((a, b) => a.cierre.localeCompare(b.cierre)).forEach(x => x.lines.forEach(l => { m[norm(l.n)] = l.c; }));
  return m;
};
const limpiarComercio = d => d.replace(/^=/, '').replace(/\s+\d{6,}.*$/, '').trim().toLowerCase().replace(/(^|\s)\S/g, c => c.toUpperCase()) || d;

function parseAmexTexto(texto, titular) {
  if (!texto.includes('American Express')) throw new Error('FORMATO');
  // Cierre y vencimiento: según el lector de PDF, vienen como "Facturación Actual 25/10/26" o como dos fechas seguidas en la primera página
  const p1 = texto.split('=====PAGINA 2=====')[0];
  let cierre = /Facturación\s+Actual\s+(\d{2})\/(\d{2})\/(\d{2})/.exec(p1), vence = /Vencimiento\s+Actual\s+(\d{2})\/(\d{2})\/(\d{2})/.exec(p1);
  if (!cierre || !vence) {
    const par = /^(\d{2})\/(\d{2})\/(\d{2})\n(\d{2})\/(\d{2})\/(\d{2})$/m.exec(p1);
    if (par) { cierre = [par[0], par[1], par[2], par[3]]; vence = [par[0], par[4], par[5], par[6]]; }
  }
  if (!cierre || !vence) throw new Error('No encontré las fechas de cierre y vencimiento del resumen.');
  const dias = (new Date(`20${vence[3]}-${vence[2]}-${vence[1]}`) - new Date(`20${cierre[3]}-${cierre[2]}-${cierre[1]}`)) / 864e5;
  if (!(dias >= 2 && dias <= 25)) throw new Error('Las fechas de cierre y vencimiento no tienen sentido; no lo cargo para no equivocarme.');
  const cy = 2000 + +cierre[3], cm = +cierre[2];
  const lineas = texto.split('\n').map(l => l.trim()).filter(l => l !== '');   // sin líneas vacías
  const TX = new RegExp('^(\\d{1,2}) de (' + Object.keys(MES_NUM).join('|') + ') ([\\d.]+,\\d{2})\\b(.*)$');
  const TOT = /^Total de cargos en (PESOS|DOLARES) (.+?) ([\d.]+,\d{2})$/;
  let seccion = 'ARS', pend = []; const bloques = {}, totales = {};
  lineas.forEach((l, i) => {
    if (l.includes('Importe en U$S')) seccion = 'USD';
    const m = TX.exec(l);
    if (m) {
      const desc = lineas[i + 1] || '', extra = lineas[i + 2] || '', mes = MES_NUM[m[2]];
      const q = /CUOTA (\d+)\/(\d+) DE ([\d.]+,\d{2})/.exec(desc + ' ' + extra);
      pend.push({ d: `${mes > cm ? cy - 1 : cy}-${String(mes).padStart(2, '0')}-${String(m[1]).padStart(2, '0')}`, v: numAR(m[3]), m: seccion, desc,
        credito: / CR\b/.test(m[4]) || desc.startsWith('ACREDITACION') || desc.startsWith('DEV '), q: q ? [+q[1], +q[2], numAR(q[3])] : null });
    }
    const t = TOT.exec(l);
    if (t) {
      const mon = t[1] === 'PESOS' ? 'ARS' : 'USD';
      bloques[t[2] + '|' + mon] = pend.filter(p => p.m === mon); pend = pend.filter(p => p.m !== mon);
      totales[t[2] + '|' + mon] = numAR(t[3]);
    }
  });
  const titulares = [...new Set(Object.keys(totales).map(k => k.split('|')[0]))];
  if (!(titular + '|ARS' in bloques)) { const e = new Error('TITULAR'); e.titulares = titulares; throw e; }
  const propias = ['ARS', 'USD'].flatMap(mon => (bloques[titular + '|' + mon] || []).filter(p => !p.credito));
  for (const mon of ['ARS', 'USD']) {
    const suma = Math.round(propias.filter(p => p.m === mon).reduce((a, p) => a + p.v, 0) * 100) / 100, esperado = totales[titular + '|' + mon] || 0;
    if (Math.abs(suma - esperado) > 0.01) throw new Error(`La suma de ${mon} (${suma}) no coincide con el total del resumen (${esperado}). No lo cargo para no equivocarme.`);
  }
  const learned = learnedCats(), nuevos = [];
  const lines = propias.sort((a, b) => a.m.localeCompare(b.m) || a.d.localeCompare(b.d)).map(p => {
    const r = DEFAULT_RULES.find(x => p.desc.toUpperCase().includes(x.c.toUpperCase()));
    const n = r ? r.n : limpiarComercio(p.desc);
    let c = r ? r.k : 'Otros';
    if (learned[norm(n)]) c = learned[norm(n)]; else if (!r) nuevos.push(n);
    return { d: p.d, v: Math.round(p.v * 100) / 100, m: p.m, c, n, q: p.q };
  });
  const iso = x => `20${x[3]}-${x[2]}-${x[1]}`;
  return { id: 'amex-' + iso(cierre), card: 'Tarjeta AMEX', cierre: iso(cierre), vence: iso(vence), titular,
    totalArs: totales[titular + '|ARS'], totalUsd: totales[titular + '|USD'] || 0, lines, nuevos };
}

async function importarPdf(file) {
  toast('Leyendo el resumen…');
  try {
    const texto = await pdfToText(await file.arrayBuffer());
    if (texto.replace(/=====PAGINA \d+=====|\s/g, '').length < 50) throw new Error('El PDF no tiene texto (parece una foto escaneada). Pedí el resumen en PDF original.');
    let pack;
    try { pack = parseAmexTexto(texto, S.settings.titular || 'JULIAN MORLA'); }
    catch (e) {
      if (e.message !== 'TITULAR') throw e;
      const nombre = (prompt(`No encuentro "${S.settings.titular || 'JULIAN MORLA'}" en el resumen. Titulares que figuran: ${e.titulares.join(', ')}.\nEscribí tu nombre tal cual figura:`) || '').trim().toUpperCase();
      if (!nombre) return;
      pack = parseAmexTexto(texto, nombre); S.settings.titular = nombre; save();
    }
    if (pack.nuevos.length) toast(`Revisá la categoría de: ${pack.nuevos.slice(0, 3).join(', ')}${pack.nuevos.length > 3 ? '…' : ''}`);
    stmtPreview(pack);
  } catch (e) {
    toast(e.message === 'FORMATO' ? 'Por ahora solo leo resúmenes de AMEX. Para VISA o MC necesito ver uno de muestra.' : e.name === 'PasswordException' ? 'El PDF tiene contraseña. Quitásela y probá de nuevo.' : e.name === 'InvalidPDFException' ? 'No pude abrir el archivo como PDF. Probá con el PDF original del resumen.' : e.message);
  }
}

    <button class="btn ghost" data-a="close">Cancelar</button>`);
  $('#cSave').onclick = async () => {
    S.settings.url = $('#cUrl').value.trim(); S.settings.token = $('#cTok').value.trim(); save();
    try {
      const j = await api({ action: 'ping' });
      applyStatus(j.status); save();
      closeSheet(); render(); toast('✓ Conectado. Último mes en el Sheet: ' + (j.status.ultimoMes || '—')); sync();
    } catch (err) { toast('No conecta: ' + err.message); }
  };
}

function openCats() {
  const cats = S.categories.map(c => ({ ...c }));
  const draw = () => {
    openSheet(`<h2>Categorías y atajos</h2>
      <p class="note">“Fila del Sheet” es la fila del mes donde se suma (las nuevas van a Varios). “Monto fijo” crea un atajo en Inicio.</p>` +
      cats.map((c, i) => `<div class="catedit">
        <div class="l1"><input class="in" data-k="emoji" data-i="${i}" value="${esc(c.emoji)}" maxlength="4"><input class="in" data-k="name" data-i="${i}" value="${esc(c.name)}"><button class="icon-btn" data-del="${i}">🗑</button></div>
        <div class="l2"><div><small>Fila del Sheet</small><input class="in" data-k="row" data-i="${i}" value="${esc(c.row || 'Varios')}"></div>
        <div><small>Monto fijo</small><input class="in" data-k="preset" data-i="${i}" inputmode="decimal" value="${c.preset ? numStr(c.preset) : ''}"></div>
        <div><small>¿Pagué?</small><select class="in" data-k="pago" data-i="${i}"><option value="no" ${c.pago ? '' : 'selected'}>No sigo</option><option value="si" ${c.pago ? 'selected' : ''}>Sí, seguir</option></select></div>
        <div><small>Tipo</small><select class="in" data-k="kind" data-i="${i}"><option value="gasto" ${(c.kind || 'gasto') === 'gasto' ? 'selected' : ''}>Gasto</option><option value="ingreso" ${c.kind === 'ingreso' ? 'selected' : ''}>Ingreso</option></select></div></div></div>`).join('') +
      `<button class="btn ghost" id="cAdd">+ Nueva categoría</button><button class="btn" id="cSaveC">Guardar</button><button class="btn ghost" data-a="close">Cancelar</button>`);
    const sh = $('#sheet');
    sh.oninput = ev => { const t = ev.target; if (t.dataset.k) { const c = cats[+t.dataset.i]; c[t.dataset.k] = t.dataset.k === 'preset' ? (parseNum(t.value) || 0) : t.dataset.k === 'pago' ? t.value === 'si' : t.value; } };
    sh.onchange = sh.oninput;
    sh.onclick = ev => {
      const del = ev.target.closest('[data-del]');
      if (del) { if (cats.length <= 1) return toast('Tiene que quedar al menos una'); cats.splice(+del.dataset.del, 1); draw(); return; }
      if (ev.target.id === 'cAdd') {
        const pal = ['#f08c00', '#1c7ed6', '#e03131', '#7048e8', '#0c8599', '#d6336c', '#2f9e44'];
        cats.push({ id: uid(), name: '', emoji: '🏷️', color: pal[cats.length % pal.length], row: 'Varios' }); draw();
        sh.querySelectorAll('input[data-k=name]').forEach((el, i, a) => i === a.length - 1 && el.focus());
      }
      if (ev.target.id === 'cSaveC') {
        const clean = cats.filter(c => String(c.name).trim()).map(c => ({ ...c, name: c.name.trim(), emoji: (c.emoji || '').trim() || '🏷️', row: (c.row || 'Varios').trim() || 'Varios', preset: c.preset || undefined, pago: c.pago === true }));
        if (!clean.length) return toast('Poné al menos una categoría');
        const ids = new Set(clean.map(c => c.id));
        const fb = (clean.find(c => c.id === 'otros') || clean[0]).id;
        S.entries.forEach(e => { if (e.type === 'mov' && !ids.has(e.cat)) { e.cat = fb; } });
        S.categories = clean; save(); closeSheet(); render(); toast('Categorías guardadas');
      }
    };
  };
  draw();
}

function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; document.body.appendChild(a); a.click(); a.remove();
}

/* ---------- acciones ---------- */
document.addEventListener('click', ev => {
  if (ev.target.id === 'overlay') return closeSheet();
  const b = ev.target.closest('[data-a]');
  if (!b) return;
  const a = b.dataset.a;
  if (a === 'tab') { ui.view = b.dataset.v; render(); }
  else if (a === 'prev') { shiftMonth(-1); render(); }
  else if (a === 'next') { shiftMonth(1); render(); }
  else if (a === 'menu') openMenu();
  else if (a === 'new') {
    const t = b.dataset.t;
    if (t === 'fx') openFx();
    else if (t === 'tarjeta') openMov('gasto', null, { only: 'card', currency: 'ARS' });
    else if (t === 'efectivo') openMov('gasto', null, { only: 'efectivo', cat: 'efectivo', currency: 'ARS' });
    else openMov(t);
  }
  else if (a === 'preset') { const c = cat(b.dataset.id); openMov('gasto', null, { cat: c.id, amount: c.preset, currency: 'ARS' }); }
  else if (a === 'edit') { const e = S.entries.find(x => x.id === b.dataset.id); if (e) e.type === 'fx' ? openFx(e.id) : openMov(e.kind, e.id); }
  else if (a === 'close') closeSheet();
  else if (a === 'runway') { ui.showRunway = !ui.showRunway; clearTimeout(runwayTimer); if (ui.showRunway) runwayTimer = setTimeout(hideRunway, 8000); render(); }
  else if (a === 'closing') { ui.y = +b.dataset.y; ui.m = +b.dataset.m; ui.view = 'report'; ui.scope = 'todo'; render(); }
  else if (a === 'theme') { const o = ['auto', 'light', 'dark']; S.settings.theme = o[(o.indexOf(S.settings.theme || 'auto') + 1) % 3]; save(); applyTheme(); render(); }
  else if (a === 'cur') { ui.cur = b.dataset.v; render(); }
  else if (a === 'stmt') openStmtImport();
  else if (a === 'stmtopen') openStmtDetail(b.dataset.id);
  else if (a === 'stmtdel') deleteStmt(b.dataset.id);
  else if (a === 'scope') { ui.scope = b.dataset.v; render(); }
  else if (a === 'conn') openConn();
  else if (a === 'sync') sync(true);
  else if (a === 'cot') refreshCot(true);
  else if (a === 'porpagar') openPorPagar();
  else if (a === 'pagar') marcarPagado(b.dataset.id);
  else if (a === 'cambiar') openFx(null, { usd: +b.dataset.usd });
  else if (a === 'cotopen') { ui.cotOpen = !ui.cotOpen; render(); }
  else if (a === 'pull') pullAll();
  else if (a === 'cats') openCats();
  else if (a === 'update') {
    (async () => {
      try { for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister(); for (const k of await caches.keys()) await caches.delete(k); } catch (e) {}
      location.reload();
    })();
  }
  else if (a === 'backup') download(`gastos-backup-${today()}.json`, JSON.stringify(S, null, 2), 'application/json');
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') closeSheet(); });
window.addEventListener('online', () => sync());
document.addEventListener('visibilitychange', () => { if (document.hidden) hideRunway(); else { applyTheme(); sync(); if (Date.now() - (COT.consulta || 0) > 5 * 60000) refreshCot(); } });
setInterval(applyTheme, 60000);

applyTheme();
render();
sync();
refreshCot();
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').catch(() => {});
  // si ya había una versión instalada y llega una nueva, se recarga sola una vez
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController && !window.__recargado) { window.__recargado = true; location.reload(); } });
}
</script>
</body>
</html>
